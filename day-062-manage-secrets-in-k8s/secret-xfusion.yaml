apiVersion: v1
kind: Pod
metadata:
  name: secret-xfusion
spec:
  containers:
    - name: secret-container-xfusion
      image: fedora:latest
      command:
        - /bin/bash
        - -c
        - sleep infinity
      volumeMounts:
        - name: media-secret
          mountPath: /opt/games
          readOnly: true

  volumes:
    - name: media-secret
      secret:
        secretName: media
